<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Капсула">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>Капсула</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* iOS 27 · Liquid Glass: floating glass tab bar, round glass bar buttons, capsule controls, concentric 26px radii, content scrolls under glass */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --fg:#000000; --fg2:rgba(60,60,67,.6); --sep:rgba(60,60,67,.14);
  --accent:#5856D6; --accent-fg:#FFFFFF; --tint:rgba(88,86,214,.12); --danger:#FF3B30;
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.85); --glass-edge:rgba(255,255,255,.65); --glass-sh:0 10px 30px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  --mat:#F4F2EE;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
  --r:26px; --r2:18px; --gap:30px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --fg:#FFFFFF; --fg2:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
  --accent:#7D7AFF; --accent-fg:#FFFFFF; --tint:rgba(125,122,255,.2); --danger:#FF453A;
  --glass:rgba(44,44,48,.55); --glass-hi:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.14); --glass-sh:0 10px 30px rgba(0,0,0,.5);
  --mat:#2A2A2C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --fg:#FFFFFF; --fg2:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
  --accent:#7D7AFF; --accent-fg:#FFFFFF; --tint:rgba(125,122,255,.2); --danger:#FF453A;
  --glass:rgba(44,44,48,.55); --glass-hi:rgba(255,255,255,.14); --glass-edge:rgba(255,255,255,.14); --glass-sh:0 10px 30px rgba(0,0,0,.5);
  --mat:#2A2A2C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.29 var(--f);letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(112px + env(safe-area-inset-bottom,0px))}

/* liquid glass material */
.glass,nav.tabs .in,nav.tabs .fab,.nb .back,.nb .act,.media .nav,.heart,.rotbtn,.toast{
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 .5px var(--glass-edge),var(--glass-sh)}

/* type */
.lt{padding-block:12px 2px}
.lt .eyebrow{font-size:13px;font-weight:600;letter-spacing:-.08px;color:var(--fg2);text-transform:uppercase}
.lt h1{font:700 34px/41px var(--fd);letter-spacing:.37px;margin:0;text-wrap:balance}
.lt .sub{font-size:15px;color:var(--fg2);letter-spacing:-.24px;margin-top:2px}
h2.title{font:700 24px/30px var(--fd);letter-spacing:.3px;margin:0;text-wrap:balance}
.foot{font-size:13px;line-height:18px;color:var(--fg2);letter-spacing:-.08px;margin:0}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:var(--gap)}
.sec:first-child{margin-top:0}
.sec > .sh{font:600 20px/25px var(--fd);letter-spacing:.38px;padding-inline:4px;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.sec > .sh b{font:400 15px var(--f);color:var(--fg2);letter-spacing:-.24px}
.t{font-variant-numeric:tabular-nums}

/* buttons: capsules */
.btn{min-height:52px;border-radius:999px;padding:0 22px;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;width:100%;transition:transform .2s cubic-bezier(.3,1.6,.5,1),opacity .15s}
.btn:active{transform:scale(.97)}
.btn.fill{background:var(--accent);color:var(--accent-fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.tint{background:var(--tint);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--fg)}
.btn.danger{background:transparent;color:var(--danger);font-weight:500}
.btn svg{width:20px;height:20px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* inset grouped list */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:12px 18px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;top:0;right:18px;left:18px;border-top:.5px solid var(--sep)}
.row.th{padding-block:10px}
.row.th + .row.th::before{left:80px}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .v{color:var(--fg2)}
.row .chev{color:var(--fg2);opacity:.55;font-size:22px;line-height:1}
.row .small{font-size:13px;color:var(--fg2);letter-spacing:-.08px}
.row .num{width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--accent);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none;align-self:flex-start;margin-top:0}
.row .ico{color:var(--accent);flex:none;align-self:flex-start}
.thumb{width:50px;height:50px;border-radius:14px;background:var(--mat);display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:44px;height:44px;object-fit:contain}
.thumb.card img{width:100%;height:100%;object-fit:cover}
input.field{width:100%;border:0;background:transparent;outline:none;font-size:17px;padding:0;min-height:24px}
textarea.field{width:100%;border:0;background:transparent;outline:none;font-size:15px;line-height:20px;resize:none;min-height:180px}

/* chips, segmented, search: capsules */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapx{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip{flex:none;min-height:36px;padding:0 16px;border-radius:999px;background:var(--fill);font-size:15px;font-weight:500;letter-spacing:-.24px;white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg{display:flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:-.15px;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(0,0,0,.04)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:#5A5A5E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:#5A5A5E}}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:999px;padding:0 14px;min-height:42px;color:var(--fg2)}
.search input{flex:1;border:0;background:transparent;outline:none;min-height:42px;color:var(--fg);font-size:17px}
.search svg{width:18px;height:18px;flex:none}

/* weather */
.wx{background:var(--surface);border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;gap:18px}
.wx .deg{font:200 56px/1 var(--fd);letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.wx .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.wx .cond{font-weight:600}
.wx .rain{color:var(--accent)}
.stepper{display:inline-flex;background:var(--fill);border-radius:999px;align-items:center}
.stepper button{width:42px;min-height:34px;font-size:20px}
.stepper span{min-width:40px;text-align:center;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.wx .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* look cards */
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;position:relative;display:block;width:100%;text-align:left}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;background:var(--mat)}
.card.hero img{aspect-ratio:4/5}
.card .meta{padding:12px 16px 16px;display:flex;flex-direction:column;gap:2px}
.card .name{font-size:15px;font-weight:600;letter-spacing:-.24px;line-height:20px}
.card.hero .name{font:700 22px/28px var(--fd);letter-spacing:.35px}
.card .note{font-size:13px;color:var(--fg2);letter-spacing:-.08px}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;color:var(--fg);display:grid;place-items:center}
.heart svg{width:19px;height:19px}
.heart[aria-pressed="true"]{color:#FF2D55}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.masonry{columns:2;column-gap:12px}
.masonry .card{break-inside:avoid;margin-bottom:12px}
.masonry .card.tall img{aspect-ratio:2/3}
.masonry .card .meta{padding:10px 14px 14px}

/* wardrobe */
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.tile .ph{aspect-ratio:1;background:var(--surface);border-radius:var(--r2);display:grid;place-items:center;overflow:hidden;padding:12px}
.tile .ph img{width:100%;height:100%;object-fit:contain;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.tile .ph.card{padding:0}.tile .ph.card img{object-fit:cover}
.tile[aria-current="true"] .ph{box-shadow:inset 0 0 0 2.5px var(--accent)}
.tile .nm{font-size:13px;line-height:16px;font-weight:500;letter-spacing:-.08px;padding-inline:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ct{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums;margin-top:-4px;padding-inline:2px}
.strip{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .tile{width:100px;flex:none}
.empty{background:var(--surface);border-radius:var(--r);padding:24px 20px;color:var(--fg2);font-size:15px;letter-spacing:-.24px;text-align:center}

/* floating glass tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:linear-gradient(to top,color-mix(in srgb,var(--bg) 70%,transparent),transparent)}
nav.tabs .bar{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
nav.tabs .fab{pointer-events:auto;flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
nav.tabs .fab svg{width:30px;height:30px}
nav.tabs .fab:active{transform:scale(.94)}
nav.tabs .in{pointer-events:auto;flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,1fr);border-radius:999px;padding:5px}
nav.tabs button{min-height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--fg);transition:background .25s,color .25s}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--fill)}

/* sheet: content under floating glass buttons */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.nb{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(var(--bg) 35%,color-mix(in srgb,var(--bg) 0%,transparent))}
.nb .in{max-width:600px;margin:0 auto;min-height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.nb .back,.nb .act{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.nb .back{justify-self:start}
.nb .back svg{width:11px;height:19px;margin-left:-2px}
.nb .ttl{font-weight:600;font-size:17px;max-width:56vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb .act{justify-self:end}
.nb .act svg{width:21px;height:21px}
.nb .act[aria-pressed="true"]{color:#FF2D55}
.sheet .body{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(40px + env(safe-area-inset-bottom,0px))}
.media{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface);touch-action:pan-y}
.media img{width:100%}
.media .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;color:var(--fg);display:grid;place-items:center;font-size:24px;line-height:1}
.media .prev{left:10px}.media .next{right:10px}
.dots{display:flex;justify-content:center;gap:7px;align-items:center;min-height:18px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--fill2);transition:width .25s}
.dots i.on{background:var(--fg);width:18px;border-radius:4px}
.titleblock{display:flex;flex-direction:column;gap:8px;padding-inline:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:13px;font-weight:500;letter-spacing:-.08px;padding:4px 11px;border-radius:999px;background:var(--fill);color:var(--fg)}
.itemhero{position:relative;background:var(--surface);border-radius:var(--r);aspect-ratio:1;display:grid;place-items:center;padding:28px;overflow:hidden}
.itemhero img{width:100%;height:100%;object-fit:contain;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.itemhero.card{padding:0}.itemhero.card img{object-fit:cover}
.rotbtn{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.rotbtn svg{width:21px;height:21px}
.rotbtn:active{transform:scale(.92)}
.upl{position:relative}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop{background:var(--surface);border-radius:var(--r);min-height:220px;display:grid;place-items:center;color:var(--accent);font-weight:600;overflow:hidden;position:relative}
.drop img{max-height:320px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:var(--fg);padding:12px 20px;border-radius:999px;font-weight:600;font-size:15px;z-index:60;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:push .34s cubic-bezier(.2,.9,.25,1)}@keyframes push{from{transform:translateX(28px);opacity:.4}}
  .body.from-r .media{animation:fr .26s ease-out}.body.from-l .media{animation:fl .26s ease-out}
  @keyframes fr{from{transform:translateX(40px);opacity:.4}}@keyframes fl{from{transform:translateX(-40px);opacity:.4}}
  .toast:not([hidden]){animation:pop .3s cubic-bezier(.3,1.5,.5,1)}@keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0}}
}
/* my day */
.hours{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-radius:var(--r);padding:12px 10px;margin-top:-2px}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px;font-variant-numeric:tabular-nums}
.hr .hh{font-size:12px;color:var(--fg2);font-weight:500}
.hr .ic{font-size:17px;line-height:20px}
.hr .pp{font-size:11px;color:var(--accent);font-weight:600;min-height:13px}
.hr .tt{font-size:15px;font-weight:600}
.hr.out{background:var(--fill)}
.hr.now .hh{color:var(--fg)}
.row.ev .tm{width:52px;flex:none;font-weight:600;font-size:15px;display:flex;flex-direction:column;line-height:1.2;align-self:flex-start}
.row.ev .tm small{font-weight:400;color:var(--fg2);font-size:13px}
.row .x{flex:none;width:30px;height:30px;border-radius:50%;color:var(--fg2);font-size:20px;line-height:1;opacity:.6}
.row.chk{gap:14px}
.cb{flex:none;width:24px;height:24px;border-radius:50%;border:1.8px solid var(--fg2);opacity:.75;display:grid;place-items:center;transition:background .2s,border-color .2s}
.cb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);opacity:1}
.cb[aria-pressed="true"]::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:translateY(-1px) rotate(45deg)}
.cb.add{border-style:dashed;color:var(--fg2);font-size:16px;line-height:1}
.grow.done{color:var(--fg2);text-decoration:line-through;text-decoration-color:var(--sep)}
.btn.sm2{min-height:44px;font-size:15px}
.link.center{align-self:center;font-size:15px}
.foot.pad{padding-inline:16px}
.ico.warn{width:22px;height:22px;border-radius:50%;background:rgba(255,149,0,.16);color:#FF9500;display:grid;place-items:center;font-weight:700;font-size:13px}
.ico.okc{width:22px;height:22px;border-radius:50%;background:rgba(52,199,89,.16);color:#34C759;display:grid;place-items:center;font-weight:700;font-size:13px}
.ico svg{width:22px;height:22px;display:block}
.big{font:700 22px/28px var(--fd)}
input.field.tr{text-align:right;width:auto;min-width:130px;color:var(--accent)}
.tdays{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tday{background:var(--surface);border-radius:var(--r2);overflow:hidden}
.tday img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--mat)}
.tday .meta{padding:8px 12px 10px;display:flex;flex-direction:column}
.tday .name{font-weight:600;font-size:14px}.tday .note{font-size:12px;color:var(--fg2)}
/* chat */
.chatsheet .body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.chat{display:flex;flex-direction:column;gap:10px;min-height:50vh}
.hello{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 4px}
.logo.sm{width:56px;height:56px;border-radius:17px;background:linear-gradient(145deg,#8E8CF0,#5856D6);color:#fff;display:grid;place-items:center}
.logo.sm svg{width:30px;height:30px}
.chips.center{justify-content:center}
.msg{display:flex;flex-direction:column;gap:6px;max-width:86%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start}
.msg img{max-width:180px;border-radius:16px}
.bub{padding:10px 14px;border-radius:20px;font-size:16px;line-height:1.38;letter-spacing:-.2px;word-wrap:break-word}
.msg.me .bub{background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:6px}
.msg.ai .bub{background:var(--surface);border-bottom-left-radius:6px}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul{margin:4px 0 8px;padding-left:18px}.bub li{margin:3px 0}
.ichip{display:inline-flex;vertical-align:middle;margin:0 2px}
.ichip .thumb{width:34px;height:34px;border-radius:9px}.ichip .thumb img{width:30px;height:30px}
.dots3{display:inline-flex;gap:4px;padding:4px 0}
.dots3 i{width:7px;height:7px;border-radius:50%;background:var(--fg2);animation:blink 1.2s infinite}
.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
